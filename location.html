<script type="text/x-dc" data-dc-script>
const EN = (localStorage.getItem('ss-lang') || 'sq') === 'en';
const t = (sq, en) => (EN ? en : sq);
// Approximate distances from the studio – edit here.
const DISTANCES = [
  ['Plazhet e Ksamilit', 'Ksamil beaches', '1.2 km'],
  ['Ishujt e Ksamilit', 'Ksamil islands', '1.5 km'],
  ['Parku Kombëtar i Butrintit', 'Butrint National Park', '5 km'],
  ['Sarandë, qendra & shëtitorja', 'Sarandë centre & promenade', '14 km'],
  ['Kalaja e Lëkurësit', 'Lëkurësi Castle', '13 km'],
  ['Porti i Sarandës · traget për Korfuz', 'Sarandë port · ferry to Corfu', '15 km'],
  ['Syri i Kaltër', 'Blue Eye spring', '35 km'],
  ['Aeroporti i Korfuzit (me traget)', 'Corfu airport (by ferry)', '≈ 1.5 h'],
];
const TODO = [
  ['Plazhet e Ksamilit', 'Ksamil beaches', 'Ujë i kaltër dhe rërë e bardhë, disa minuta nga dera.', 'Turquoise water and white sand, minutes from the door.'],
  ['Butrinti', 'Butrint', 'Qytet antik në listën e UNESCO-s, mes pyllit dhe lagunës.', 'A UNESCO ancient city between forest and lagoon.'],
  ['Ishujt me varkë', 'Island hopping', 'Me kajak ose varkë drejt katër ishujve përballë Ksamilit.', 'By kayak or boat to the four islands off Ksamil.'],
  ['Syri i Kaltër', 'The Blue Eye', 'Burim natyror me ujë të thellë blu në mes të gjelbërimit.', 'A natural spring of deep blue water deep in the green.'],
  ['Kalaja e Lëkurësit', 'Lëkurësi Castle', 'Perëndim dielli mbi Sarandë dhe Korfuz nga lart.', 'Sunset over Sarandë and Corfu from above.'],
  ['Korfuzi me traget', 'Corfu by ferry', 'Një ditë në Greqi, vetëm 30 minuta nga Saranda.', 'A day in Greece, only 30 minutes from Sarandë.'],
];
class Component extends DCLogic {
  renderVals() {
    return {
      distances: DISTANCES.map(([sq, en, km]) => ({ name: t(sq, en), km })),
      todo: TODO.map(([sq, en, tsq, ten], i) => ({ n: String(i + 1).padStart(2, '0'), title: t(sq, en), text: t(tsq, ten) })),
    };
  }
}
</script>
